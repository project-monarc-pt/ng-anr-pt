<md-card class="anr-info-card" ng-if="model && OFFICE_MODE == 'FO' && model.anr.isSnapshot">
    <md-card-content class="anr-info-card-content">
        <md-toolbar layout="row" class="anr-info-banner">
            <div flex="70" translate>You are currently on a snapshot, no changes will be possible.</div>
            <a flex class="txtright anr-link-on-info" ui-sref="main.project.anr({modelId: model.anr.snapshotParent})"><md-icon class="material-icons">undo</md-icon><span>{{ 'Return to risk analysis' | translate }}</span></a>
        </md-toolbar>
    </md-card-content>
</md-card>
